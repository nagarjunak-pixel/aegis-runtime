[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "aegis-runtime"
version = "0.4.0"
description = "Deterministic Zero-Trust Control Plane, AST Policy Gatekeeper, Cryptographic Merkle Audit Ledger, and Transactional Saga Engine for Enterprise AI Agents"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
  { name = "Nagarjuna Kamireddy", email = "sendemailtonagarjuna@gmail.com" },
]
keywords = [
  "agentic-ai",
  "control-plane",
  "zero-trust",
  "policy-as-code",
  "distributed-sagas",
  "mcp",
  "merkle-ledger",
  "finops",
  "enterprise-erp",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Distributed Computing",
  "Topic :: Security :: Cryptography",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "cryptography>=42.0.0",
  "httpx>=0.27.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
  "opentelemetry-api>=1.25.0",
  "opentelemetry-sdk>=1.25.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "hypothesis>=6.100.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]

[project.scripts]
aegis = "aegis.cli:app"

[project.urls]
Homepage = "https://github.com/nagarjunak-pixel/aegis-runtime"
Repository = "https://github.com/nagarjunak-pixel/aegis-runtime"
Documentation = "https://github.com/nagarjunak-pixel/aegis-runtime/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["opentelemetry.*"]
ignore_missing_imports = true
